name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  schedule:
    - cron: '*/5 * * * *'

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-versions: ['8.3']
    name: integration-tests (PHP ${{ matrix.php-versions }})
    steps:
      - uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fetch OCI private key
        env:
          OCI_PRIVATE_KEY_SOURCE: ${{ secrets.OCI_PRIVATE_KEY_FILENAME }}
        run: |
          key_file="$RUNNER_TEMP/oci_api_key.pem"
          if [[ "$OCI_PRIVATE_KEY_SOURCE" =~ ^https?:// ]]; then
            code=$(curl -sSL --max-time 30 -o "$key_file" -w '%{http_code}' "$OCI_PRIVATE_KEY_SOURCE" || true)
            echo "Private key URL returned HTTP $code"
            [[ "$code" == "200" ]] || exit 1
          else
            cp "$OCI_PRIVATE_KEY_SOURCE" "$key_file"
          fi
          chmod 600 "$key_file"
          echo "OCI_PRIVATE_KEY_FILENAME=$key_file" >> "$GITHUB_ENV"

      - name: Verify OCI credentials
        run: php verify.php
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
